services:
  - type: web
    name: gramsutra
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
